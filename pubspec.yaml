name: flutter_device_state
description: Monitor system state including VPN, network capabilities, thermal status, and more. Native Android implementation using Kotlin.
version: 1.0.0
repository: https://github.com/Istiak-Ahmed78/flutter_device_state
homepage: https://github.com/Istiak-Ahmed78/flutter_device_state
issue_tracker: https://github.com/Istiak-Ahmed78/flutter_device_state/issues
documentation: https://github.com/Istiak-Ahmed78/flutter_device_state#readme

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_device_state
        pluginClass: FlutterDeviceStatePlugin
      ios:
        pluginClass: FlutterDeviceStatePlugin
      macos:  # ✅ Add this
        pluginClass: FlutterDeviceStatePlugin